<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f7fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MyAligner" />
  <title>MyAligner</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <header>
    <div>
      <div class="eyebrow">O MEU APARELHO</div>
      <h1>MyAligner 🦷</h1>
    </div>
    <button class="ghost" id="resetBtn">Repor hoje</button>
  </header>

  <section class="card hero">
    <div class="date" id="dateLabel"></div>
    <div class="ring" id="ring">
      <div>
        <strong id="todayTime">00h 00m</strong>
        <span id="goalText">de 22h</span>
        <b id="percent">0%</b>
      </div>
    </div>
    <div class="status" id="status">Aparelho fora</div>
    <div class="substatus" id="substatus">Toca no botão quando o colocares.</div>
    <button class="mainBtn" id="toggleBtn">COLOQUEI O APARELHO</button>
  </section>

  <section class="grid">
    <div class="card mini">
      <span>Meta diária</span>
      <strong><input id="goalInput" type="number" min="1" max="24" step="0.5" value="22"> h</strong>
    </div>
    <div class="card mini">
      <span>Tempo fora hoje</span>
      <strong id="outTime">00h 00m</strong>
    </div>
  </section>

  <section class="card">
    <h2>Últimos 7 dias</h2>
    <div id="history"></div>
  </section>

  <p class="note">Os dados ficam guardados neste dispositivo. A meta deve seguir a indicação do teu dentista/ortodontista.</p>
</main>
<script src="app.js"></script>
</body>
</html>
